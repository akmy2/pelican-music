name: Gerar IPA iOS
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar para iPhone sem assinatura
        run: >-
          xcodebuild -project PelicanMusic.xcodeproj
          -scheme PelicanMusic -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar IPA sem assinatura
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PelicanMusic.app package/Payload/
          cd package
          /usr/bin/zip -qry ../PelicanMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PelicanMusic-unsigned-IPA
          path: PelicanMusic-unsigned.ipa
          if-no-files-found: error
