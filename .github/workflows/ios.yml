name: Gerar IPA iOS
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar para iPhone sem assinatura
        run: >-
          xcodebuild -project PelicanMusic.xcodeproj
          -scheme PelicanMusic -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar IPA sem assinatura
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PelicanMusic.app package/Payload/
          cd package
          /usr/bin/zip -qry ../PelicanMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PelicanMusic-unsigned-IPA
          path: PelicanMusic-unsigned.ipa
          if-no-files-found: error
      - name: Testar regressões de áudio e importação
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          echo "START_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project PelicanMusic.xcodeproj -scheme PelicanMusic -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 60 -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO test
      - name: Capturar dashboard real no simulador
        run: |
          xcrun simctl launch "$START_SIMULATOR_ID" com.pelican.music
          sleep 3
          xcrun simctl io "$START_SIMULATOR_ID" screenshot START-dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: START-dashboard-real
          path: START-dashboard.png
          if-no-files-found: error
