name: PelicanMusic
options:
  bundleIdPrefix: com.pelican
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PelicanMusic:
    type: application
    platform: iOS
    sources: [PelicanMusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pelican.music
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PelicanMusic/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
