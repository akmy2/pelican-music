name: PelicanMusic
options:
  bundleIdPrefix: com.pelican
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PelicanMusic:
    type: application
    platform: iOS
    sources: [PelicanMusic]
    dependencies:
      - target: STARTWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pelican.music
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PelicanMusic/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
      testTargets: [STARTTests]
  STARTTests:
    type: bundle.unit-test
    platform: iOS
    sources: [STARTTests]
    dependencies:
      - target: PelicanMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  STARTWidget:
    type: app-extension
    platform: iOS
    sources: [STARTWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pelican.music.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: STARTWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
